
# possible values: OFF,FATAL,ERROR,WARN,INFO,DEBUG,TRACE,ALL
logLevel=ALL

# reload plugin settings when settings.properties changes
reloadOnChange=true

# chat command used by players and admins
marketCommand=mp

# send plugin welcome message to player on login
sendPluginWelcome=false

# enable local listings tied to market zones
localMarketplaceEnabled=true

# enable global listings in zones that allow global trade
globalMarketplaceEnabled=true

# when true, listing discovery outside market zones is disabled
marketZoneOnlyMode=false

# default fee percentage charged to buyers for local listings when no zone override is used
defaultLocalFeePercent=5

# default fee percentage charged to buyers for global listings
defaultGlobalFeePercent=5

# minimum whole-number fee charged to buyers for local listings
minimumLocalFee=0

# minimum whole-number fee charged to buyers for global listings
minimumGlobalFee=0

# maximum active listings per player
maxListingsPerPlayer=20

# maximum market areas a player may own: 0 disables, negative means unlimited
maxPlayerMarketplaces=0

# show a compact HUD indicator while players are inside a market zone
showMarketplaceZoneIndicator=true

# future native plugin route exposure flags
exposeMarketplaceZones=true
exposeMarketplaceOffers=true
